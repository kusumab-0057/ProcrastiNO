<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ProcrastiNO</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #f7f3ff;
        }


        /* =====================================================
           FULL LANDING PAGE ARTWORK
        ====================================================== */

        .landing-page {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background: #f7f3ff;
        }

        .landing-art {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: fill;

            display: block;

            user-select: none;
            pointer-events: none;
        }


        /* =====================================================
           REAL CLICKABLE LOGIN / SIGN UP AREAS
           The buttons are invisible because their appearance
           already exists inside the generated artwork.
        ====================================================== */

        .top-buttons {
            position: absolute;

            top: 3.2%;
            right: 3.5%;

            display: flex;
            align-items: center;

            gap: 12px;

            z-index: 20;
        }

        .real-login,
        .real-signup {
            display: block;

            height: 48px;

            border-radius: 30px;

            background: transparent;

            border: none;

            cursor: pointer;

            text-decoration: none;
        }

        .real-login {
            width: 112px;
        }

        .real-signup {
            width: 126px;
        }


        /* =====================================================
           REAL GET STARTED AREA
        ====================================================== */

        .real-get-started {
            position: absolute;

            left: 50%;
            top: 93%;

            transform: translate(-50%, -50%);

            width: 215px;
            height: 64px;

            border: none;
            border-radius: 35px;

            background: transparent;

            cursor: pointer;

            z-index: 20;
        }


        /* =====================================================
           INTRO SCREEN
        ====================================================== */

        .intro-screen {
            position: fixed;
            inset: 0;

            z-index: 99999;

            display: none;
            align-items: center;
            justify-content: center;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at center,
                    #eee7ff 0%,
                    #f7f3ff 55%,
                    #fbfaff 100%
                );
        }

        .intro-screen.show {
            display: flex;
        }


        .intro-image-wrapper {
            position: relative;

            width: min(900px, 92vw);
            max-height: 88vh;

            display: flex;
            align-items: center;
            justify-content: center;

            /*
             * This creates the soft disappearing outline.
             * There is NO scale animation.
             */

            -webkit-mask-image:
                radial-gradient(
                    ellipse at center,
                    black 42%,
                    rgba(0, 0, 0, 0.95) 58%,
                    rgba(0, 0, 0, 0.65) 72%,
                    rgba(0, 0, 0, 0.20) 88%,
                    transparent 100%
                );

            mask-image:
                radial-gradient(
                    ellipse at center,
                    black 42%,
                    rgba(0, 0, 0, 0.95) 58%,
                    rgba(0, 0, 0, 0.65) 72%,
                    rgba(0, 0, 0, 0.20) 88%,
                    transparent 100%
                );

            animation:
                softFade 4.5s ease-in-out forwards;
        }


        .intro-image-wrapper img {
            width: 100%;
            height: auto;

            max-height: 88vh;

            object-fit: contain;

            display: block;
        }


        /*
         * Fade only.
         * No zoom.
         */

        @keyframes softFade {

            0% {
                opacity: 0;

                filter: blur(8px);
            }

            18% {
                opacity: 1;

                filter: blur(0);
            }

            70% {
                opacity: 1;

                filter: blur(0);
            }

            86% {
                opacity: 0.65;

                filter: blur(2px);
            }

            100% {
                opacity: 0;

                filter: blur(7px);
            }
        }


        .intro-screen.show {
            animation:
                screenFade 4.5s ease-in-out forwards;
        }


        @keyframes screenFade {

            0% {
                opacity: 0;
            }

            12% {
                opacity: 1;
            }

            82% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }


        /* =====================================================
           SMALL SCREENS
        ====================================================== */

        @media (max-width: 700px) {

            .top-buttons {
                top: 2.7%;
                right: 2.5%;

                gap: 5px;
            }

            .real-login {
                width: 78px;
                height: 40px;
            }

            .real-signup {
                width: 91px;
                height: 40px;
            }

            .real-get-started {
                top: 91%;

                width: 180px;
                height: 55px;
            }
        }


        @media (prefers-reduced-motion: reduce) {

            .intro-image-wrapper,
            .intro-screen {
                animation-duration: 0.01ms !important;
            }
        }
    </style>
</head>


<body>


    <!-- =====================================================
         LANDING PAGE
    ====================================================== -->

    <div class="landing-page" id="landingPage">

        <!--
            THIS IS THE FULL GENERATED PROCRASTINO DESIGN.
            It is NOT a small illustration anymore.
        -->

        <img
            class="landing-art"
            src="{{ url_for('static', filename='study-illustration.png') }}"
            alt="ProcrastiNO landing page">


        <!-- REAL LOGIN + SIGN UP -->

        <div class="top-buttons">

            <a
                href="/login"
                class="real-login"
                aria-label="Login">
            </a>

            <a
                href="/signup"
                class="real-signup"
                aria-label="Sign Up">
            </a>

        </div>


        <!-- REAL GET STARTED -->

        <button
            type="button"
            id="getStartedButton"
            class="real-get-started"
            aria-label="Get Started">
        </button>

    </div>


    <!-- =====================================================
         INTRO
    ====================================================== -->

    <div
        class="intro-screen"
        id="introScreen">

        <div class="intro-image-wrapper">

            <img
                src="{{ url_for('static', filename='intro-illustration.png') }}"
                alt="Let's Start">

        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        const getStartedButton =
            document.getElementById("getStartedButton");

        const landingPage =
            document.getElementById("landingPage");

        const introScreen =
            document.getElementById("introScreen");


        getStartedButton.addEventListener("click", function () {

            /*
             * Prevent accidental double-clicking.
             */

            getStartedButton.disabled = true;


            /*
             * Hide the landing page.
             */

            landingPage.style.display = "none";


            /*
             * Show the girl + boy intro.
             */

            introScreen.classList.add("show");


            /*
             * Let the soft fade finish,
             * then continue to the existing dashboard.
             */

            setTimeout(function () {

                window.location.href = "/login";

            }, 3500);

        });

    </script>

</body>
</html>
